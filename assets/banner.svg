<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Capability Router</title>
  <desc id="desc">A banner showing task intent routed into tools, skills, plugins, subagents, automations, and proof.</desc>
  <rect width="1200" height="420" fill="#0B0F14"/>
  <rect x="40" y="40" width="1120" height="340" rx="20" fill="#111827" stroke="#263241" stroke-width="2"/>
  <path d="M100 296C190 236 266 236 356 296C446 356 522 356 612 296C702 236 778 236 868 296C958 356 1034 356 1124 296" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M100 118C196 176 274 176 370 118C466 60 544 60 640 118C736 176 814 176 910 118C1006 60 1078 60 1124 94" stroke="#F97316" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

  <g filter="url(#shadow)">
    <rect x="78" y="84" width="264" height="232" rx="16" fill="#0F172A" stroke="#334155"/>
    <text x="108" y="137" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" letter-spacing="2">TASK SHAPE</text>
    <text x="108" y="184" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="750">What is the</text>
    <text x="108" y="225" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="750">right lever?</text>
    <text x="108" y="270" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">tool, skill, plugin, team,</text>
    <text x="108" y="296" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">automation, or proof?</text>
  </g>

  <g>
    <path d="M370 200H452" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <path d="M452 200L436 186M452 200L436 214" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="472" y="70" width="408" height="260" rx="22" fill="#0B1220" stroke="#334155" stroke-width="2"/>
    <text x="512" y="128" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800">Agent Capability</text>
    <text x="512" y="178" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800">Router</text>
    <text x="512" y="224" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Routes Codex and Claude Code</text>
    <text x="512" y="255" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">toward the smallest useful capability.</text>
    <rect x="512" y="284" width="98" height="36" rx="8" fill="#14B8A6"/>
    <text x="532" y="308" fill="#042F2E" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800">ROUTE</text>
    <rect x="624" y="284" width="92" height="36" rx="8" fill="#F97316"/>
    <text x="643" y="308" fill="#431407" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800">COST</text>
    <rect x="730" y="284" width="94" height="36" rx="8" fill="#A78BFA"/>
    <text x="748" y="308" fill="#2E1065" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800">PROOF</text>
  </g>

  <g>
    <path d="M902 200H984" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <path d="M984 200L968 186M984 200L968 214" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1000" y="84" width="124" height="232" rx="16" fill="#0F172A" stroke="#334155"/>
    <circle cx="1032" cy="124" r="10" fill="#2DD4BF"/>
    <text x="1052" y="130" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">tools</text>
    <circle cx="1032" cy="164" r="10" fill="#F97316"/>
    <text x="1052" y="170" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">skills</text>
    <circle cx="1032" cy="204" r="10" fill="#A78BFA"/>
    <text x="1052" y="210" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">teams</text>
    <circle cx="1032" cy="244" r="10" fill="#FACC15"/>
    <text x="1052" y="250" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">proof</text>
    <circle cx="1032" cy="284" r="10" fill="#38BDF8"/>
    <text x="1052" y="290" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">loops</text>
  </g>

  <defs>
    <filter id="shadow" x="0" y="0" width="1200" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
</svg>
